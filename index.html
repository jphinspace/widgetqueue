<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Queue Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 10px;
        }
        #controls {
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        canvas {
            border: 2px solid #333;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        label {
            font-weight: bold;
        }
        input[type="range"] {
            width: 200px;
        }
        #speedValue {
            min-width: 40px;
            display: inline-block;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:active {
            background-color: #3d8b40;
        }
    </style>
</head>
<body>
    <h1>Widget Queue Simulation</h1>
    <div id="controls">
        <label for="speedSlider">Simulation Speed:</label>
        <input type="range" id="speedSlider" min="0.1" max="10" step="0.1" value="1">
        <span id="speedValue">1.0x</span>
        <button id="spawnButton">Spawn Customer</button>
    </div>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script src="config.js"></script>
    <script src="entities.js"></script>
    <script src="customer.js"></script>
    <script src="simulation.js"></script>
</body>
</html>
